# Higher resolution keeps small ripe fruit visible; budget remains laptop friendly.
model: yolo11n.pt
image_size: 512
batch_size: 4
max_hours: 0.4
patience: 7
workers: 2
seed: 42
optimizer: AdamW
initial_learning_rate: 0.001
final_lr_fraction: 0.01
weight_decay: 0.0005
cosine_lr: true
class_weight_power: 0.5
validation_fraction: 0.2
prediction_confidence: 0.05
match_iou: 0.5
