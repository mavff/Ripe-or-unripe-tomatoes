model: yolo11n.pt
image_size: 512
batch_size: 4
max_hours: 2.0
patience: 7
workers: 2
seed: 42
# AdamW uses decoupled weight decay. The cosine schedule ends at lr0 * lrf.
optimizer: AdamW
initial_learning_rate: 0.001
final_lr_fraction: 0.01
weight_decay: 0.0005
cosine_lr: true
# Partial inverse-frequency weighting of the classification loss (0 disables it).
class_weight_power: 0.25
validation_fraction: 0.2
prediction_confidence: 0.05
match_iou: 0.5
